# Copy this file to secrets.toml and fill in your own values:
#     cp .streamlit/secrets.toml.example .streamlit/secrets.toml
#
# secrets.toml is listed in .gitignore and must never be committed.
# Every value here is optional — the app falls back to the defaults shown.

# Where the FastAPI backend is listening. Default: http://localhost:8000
API_BASE = "http://localhost:8000"

# Optional AI provider key. When set, it pre-fills the sidebar field in the
# AI Chat tab. The current build generates replies locally and never sends
# this anywhere; it is read so the wiring is in place.
AI_API_KEY = ""
